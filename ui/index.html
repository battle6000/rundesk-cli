<!doctype html>
<!-- Dark is the only theme this ships. Said on the element and in the meta, so native
     scrollbars and <details> markers render dark without being styled, and a slow first
     paint is never a flash of white. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rundesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
